version: "3"

tasks:
    infra:up:
        desc: Start local infrastructure services (Postgres) only if needed
        cmds:
            - '{{if eq .OS "windows"}}powershell -NoProfile -Command "$id = docker compose -f docker-compose.dev.yml ps -q postgres; if ($id) { Write-Host \"Postgres is already running\" } else { docker compose -f docker-compose.dev.yml up -d }"{{else}}if [ "$(docker compose -f docker-compose.dev.yml ps -q postgres)" ]; then echo "Postgres is already running"; else docker compose -f docker-compose.dev.yml up -d; fi{{end}}'

    infra:down:
        desc: Stop local infrastructure services
        cmds:
            - docker compose -f docker-compose.dev.yml down

    backend:dev:
        desc: Start the Spring Boot backend
        deps: [infra:up]
        dir: Films_SpringBoot
        cmds:
            - '{{if eq .OS "windows"}}mvnw.cmd spring-boot:run{{else}}./mvnw spring-boot:run{{end}}'

    frontend:dev:
        desc: Start the Angular frontend
        dir: Films_Angular
        cmds:
            - ng serve

    frontend:build:
        desc: Build the Angular frontend
        dir: Films_Angular
        cmds:
            - ng build
