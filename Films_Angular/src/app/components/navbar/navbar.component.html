<nav id="navDiv"
      class="fixed top-0 z-30 flex h-16 w-full items-center justify-between border-b border-slate-200/70 bg-white/80 px-4 py-1 shadow-[0_20px_50px_-30px_rgba(15,23,42,0.45)] backdrop-blur-xl transition-all sm:px-6">
      <a routerLink="/home" class="flex items-center gap-3">
            <img src="logo.png" alt="Logo" class="h-12 w-12 rounded-full object-cover shadow-sm" />
            <span class="hidden text-sm font-semibold tracking-[0.2em] text-slate-700 sm:block">FILMSPOT</span>
      </a>

      <ul class="hidden items-center gap-2 md:flex">
            <li>
                  <a routerLink="/home"
                        class="flex rounded-full px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-indigo-50 hover:text-indigo-700">
                        Home
                  </a>
            </li>
            <li>
                  <a routerLink="/films"
                        class="flex rounded-full px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-indigo-50 hover:text-indigo-700">
                        Films
                  </a>
            </li>
            @if (!(authService.user$ | async)) {
            <li>
                  <a routerLink="/signup"
                        class="flex w-full rounded-full bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-700">
                        Sign up
                  </a>
            </li>
            } @else {
            <li>
                  <button (click)="logout()"
                        class="flex w-full rounded-full bg-slate-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">
                        Logout
                  </button>
            </li>
            }
      </ul>
</nav>

<div class="fixed right-4 top-4 z-50 flex md:hidden">
      <button id="closeMenu" (click)="toggleMenu()"
            class="rounded-full border border-slate-200 bg-white/90 p-2 shadow-sm">
            @if (!isMenuOpen()) {
            <fa-icon [icon]="menuIcon" class="text-xl text-slate-700 transition-colors"></fa-icon>
            } @else {
            <fa-icon [icon]="xMarkIcon" class="text-xl text-slate-700 transition-colors"></fa-icon>
            }
      </button>
</div>

<div id="outside" class="fixed inset-0 z-40 overflow-hidden md:hidden" (click)="toggleMenuOutsideClick($event)"
      [ngClass]="{ 'hidden': !isMenuOpen(), 'block bg-slate-950/70': isMenuOpen() }">
      <div id="menuDiv" (click)="$event.stopPropagation()"
            [ngClass]="{ 'translate-x-0': isMenuOpen(), 'translate-x-full': !isMenuOpen() }"
            class="absolute right-0 top-0 flex h-full w-72 max-w-[85vw] flex-col overflow-hidden bg-white/95 pt-20 shadow-2xl transition-transform duration-300">
            <div class="flex h-full flex-col justify-between">
                  <ul class="flex h-full flex-col space-y-2 px-4 py-4">
                        <li>
                              <a routerLink="/home"
                                    class="flex w-full rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-indigo-50 hover:text-indigo-700">
                                    Home
                              </a>
                        </li>
                        <li>
                              <a routerLink="/films"
                                    class="flex w-full rounded-2xl px-4 py-3 text-base font-semibold text-slate-700 transition hover:bg-indigo-50 hover:text-indigo-700">
                                    Films
                              </a>
                        </li>
                  </ul>

                  <ul class="flex flex-col space-y-3 px-4 py-4">
                        @if (!(authService.user$ | async)) {
                        <li>
                              <a routerLink="/signup"
                                    class="flex w-full rounded-2xl bg-indigo-600 px-4 py-3 text-center text-base font-semibold text-white transition hover:bg-indigo-700">
                                    Sign up
                              </a>
                        </li>
                        } @else {
                        <li>
                              <button (click)="logout()"
                                    class="flex w-full rounded-2xl bg-slate-800 px-4 py-3 text-base font-semibold text-white transition hover:bg-slate-700">
                                    Logout
                              </button>
                        </li>
                        }
                  </ul>
            </div>
      </div>
</div>
