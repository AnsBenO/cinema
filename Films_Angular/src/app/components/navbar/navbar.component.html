<nav id="navDiv"
      class="fixed top-0 z-30 flex h-16 w-full items-center justify-between border-b border-slate-200/70 bg-white/80 px-4 py-1 shadow-[0_20px_50px_-30px_rgba(15,23,42,0.45)] backdrop-blur-xl transition-all sm:px-6">
      <!-- Logo Section -->
      <a routerLink="/home" class="flex items-center gap-3">
            <img src="logo.png" alt="Logo" class="h-12 w-12 rounded-full object-cover shadow-sm" />
            <span class="hidden text-sm font-semibold tracking-[0.2em] text-slate-700 sm:block">FILMSPOT</span>
      </a>



      <!-- Navigation Links for Desktop -->
      <ul class="hidden md:flex space-x-6">
            <li>
                  <a routerLink="/home"
                        class="flex text-md px-4 py-2 rounded font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors">
                        Home
                  </a>
            </li>
            <li>
                  <a routerLink="/films"
                        class="flex text-md px-4 py-2 rounded font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors">
                        Films
                  </a>
            </li>
            @if (!(authService.user$ | async)) {

            <li>
                  <a routerLink="/signup"
                        class="flex text-md font-semibold bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-700 transition-colors w-full">
                        signup
                  </a>
            </li>
            }@else {

            <li>
                  <button (click)="logout()"
                        class="flex text-md font-semibold bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-700 transition-colors w-full">
                        logout
                  </button>
            </li>
            }
      </ul>
</nav>

<!-- Hamburger Menu Button -->
<div class="flex md:hidden z-50 fixed top-4 right-4">
      <button id="closeMenu" (click)="toggleMenu()" class="z-50">
            @if (!isMenuOpen()) {

            <fa-icon [icon]="menuIcon"
                  class="text-2xl text-slate-600 hover:text-slate-800 focus:outline-none transition-colors"></fa-icon>
            }@else {

            <fa-icon [icon]="xMarkIcon"
                  class="text-2xl text-slate-200 hover:text-white focus:outline-none transition-colors"></fa-icon>
            }

      </button>
</div>

<!-- Side Menu For Smaller Screens -->
<div id="outside" class="fixed inset-0 z-40 md:hidden transform transition-all" (click)="toggleMenuOutsideClick($event)"
      [ngClass]="{ 'translate-x-full bg-opacity-100': !isMenuOpen(), 'translate-x-0 bg-slate-900/80 bg-opacity-75': isMenuOpen() }">
      <div id="menuDiv" (click)="$event.stopPropagation()" [ngClass]="{ 'w-60': isMenuOpen(), 'w-0': !isMenuOpen() }"
            class="side-menu w-64 flex flex-col bg-slate-900 absolute top-0 right-0 h-full shadow-sm overflow-hidden transition-all pt-20">
            <div class="flex-1 flex flex-col justify-between h-full">
                  <!-- Pages' Links -->
                  <ul class="flex flex-col space-y-4 px-4 py-4 h-full">
                        <li>
                              <a routerLink="/home"
                                    class="flex text-md px-4 py-2 rounded font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition-colors w-full">
                                    home
                              </a>
                        </li>
                        <li>
                              <a routerLink="/films"
                                    class="flex text-md px-4 py-2 rounded font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition-colors w-full">
                                    Films
                              </a>
                        </li>

                  </ul>

                  <!-- Auth Links -->
                  <ul class="flex flex-col justify-end space-y-4 px-4 py-4 h-full">

                        @if (!(authService.user$ | async)) {
                        <li>
                              <a routerLink="/signup"
                                    class="flex text-md font-semibold bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-700 transition-colors w-full">
                                    signup
                              </a>
                        </li>

                        }@else {
                        <li>
                              <button (click)="logout()"
                                    class="flex text-md font-semibold bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-700 transition-colors w-full">
                                    logout
                              </button>
                        </li>

                        }

                  </ul>
            </div>
      </div>
</div>
