<app-dialog-shell [(visible)]="visible" width="min(92vw, 860px)" [closeDisabled]="isSubmitting()"
      (closed)="onDialogClosed()">
      @if (hasFilm()) {
      <div class="flex flex-col gap-6">
            <div class="flex flex-wrap items-start justify-center gap-3">
                  <div>
                        <div class="film-title flex items-center gap-1">
                              <h2 class="m-0 text-2xl font-bold text-slate-800">{{ film!.title }}</h2>
                              <span class="rounded-full bg-indigo-50 py-1 text-sm font-semibold text-indigo-700">{{film!.year
                                    }}</span>

                        </div>
                        <p class="mt-1 text-sm font-semibold uppercase tracking-[0.25em] text-indigo-600">Featured
                              film</p>
                  </div>
            </div>

            <div class="flex flex-col gap-5 lg:flex-row">
                  <img [src]="serverUrl + film!.imageUrl" [alt]="film!.title + ' poster'"
                        class="h-[320px] w-full max-w-[240px] rounded-[1.25rem] object-cover shadow-sm sm:h-[360px] sm:max-w-[260px]" />

                  <div class="flex-1">
                        <div class="rounded-[1.25rem] border border-slate-200 bg-slate-50/80 p-4">
                              <p class="m-0 text-sm font-semibold text-slate-700">
                                    <span class="text-indigo-600">Duration:</span> {{ film!.duration }} mins
                              </p>
                              <p class="mt-3 whitespace-pre-line text-sm leading-6 text-slate-600">
                                    {{ film!.description }}
                              </p>
                        </div>

                        <div class="mt-5 border-t border-slate-200 pt-5">
                              <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                                    <div class="flex flex-col gap-2">
                                          <label for="score" class="text-sm font-semibold text-slate-700">Rate
                                                this film:</label>
                                          <p-rating [(ngModel)]="score" [stars]="5"
                                                [disabled]="isSubmitting()"></p-rating>
                                    </div>

                                    <button pButton (click)="submitRating()"
                                          [disabled]="!hasValidScore() || isSubmitting()"
                                          class="rounded-full bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-70">
                                          @if (isSubmitting()) {
                                          Submitting...
                                          } @else {
                                          Submit Rating
                                          }
                                    </button>
                              </div>
                        </div>
                  </div>
            </div>
      </div>
      }
</app-dialog-shell>
