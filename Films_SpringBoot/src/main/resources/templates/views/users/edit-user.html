<th:block th:replace="~{layouts/modal :: modal(~{::.modal-icon}, ~{::.modal-title}, ~{::.modal-form})}">

      <i class="fa-solid fa-user modal-icon"></i>
      <span class="modal-title">Update User with Username <span th:text="${user.username}"></span></span>

      <form class="modal-form space-y-8" th:object="${user}" th:attr="hx-post=@{/users/edit/{id}(id=${user.id})}"
            hx-target="#modal" hx-swap="outerHTML">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <!-- First Column -->
                  <div class="space-y-4">
                        <div class="flex flex-col">
                              <label for="username" class="text-gray-700 font-semibold flex items-center gap-2">
                                    <i class="fa-regular fa-user"></i> Username
                              </label>
                              <input type="text" id="username" th:field="*{username}"
                                    class="mt-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-800"
                                    placeholder="Enter username">
                              <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                                    class="text-red-600 text-xs mt-1 block"></span>
                        </div>

                        <div class="flex flex-col">
                              <label for="email" class="text-gray-700 font-semibold flex items-center gap-2">
                                    <i class="fa-regular fa-envelope"></i> Email
                              </label>
                              <input type="email" id="email" th:field="*{email}"
                                    class="mt-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-800"
                                    placeholder="Enter email">
                              <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                                    class="text-red-600 text-xs mt-1 block"></span>
                        </div>
                  </div>

                  <!-- Second Column -->
                  <div class="space-y-4">
                        <div class="flex flex-col">
                              <label for="role" class="text-gray-700 font-semibold flex items-center gap-2">
                                    <i class="fa-solid fa-users-cog"></i> User Role
                              </label>
                              <select id="role" th:field="*{role}"
                                    class="mt-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-800">
                                    <option value="" selected>Select a Role</option>
                                    <option th:each="role : ${T(com.ansbeno.films.shared.security.Role).values()}"
                                          th:value="${role}" th:text="${role}"></option>
                              </select>
                              <span th:if="${#fields.hasErrors('role')}" th:errors="*{role}"
                                    class="text-red-600 text-xs mt-1 block"></span>
                        </div>
                  </div>
            </div>

            <div class="flex justify-end">
                  <button type="submit" class="bg-blue-800 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-900">
                        <i class="fa-solid fa-save"></i> Save Changes
                  </button>
            </div>
      </form>

</th:block>
