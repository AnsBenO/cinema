<th:block th:replace="~{layouts/modal :: modal(~{::.modal-icon}, ~{::.modal-title}, ~{::.modal-form})}">

      <i class="fa-solid fa-user modal-icon"></i>
      <span class="modal-title">Add User</span>

      <form class="modal-form space-y-4" th:object="${user}" hx-post="/users/save" hx-target="#modal"
            hx-swap="outerHTML">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="flex flex-col">
                  <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                  <input type="text" id="username" th:field="*{username}" placeholder="Enter username"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-600 focus:border-blue-600 text-sm" />
                  <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                        class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <div class="flex flex-col">
                  <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                  <input type="email" id="email" th:field="*{email}" placeholder="Enter email"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-600 focus:border-blue-600 text-sm" />
                  <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                        class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <div class="flex flex-col">
                  <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                  <input type="password" id="password" th:field="*{password}" placeholder="Enter password"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-600 focus:border-blue-600 text-sm" />
                  <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                        class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <div class="flex flex-col">
                  <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
                  <select id="role" th:field="*{role}"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-600 focus:border-blue-600 text-sm">
                        <option value="" disabled>Select Role</option>
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                  </select>
                  <span th:if="${#fields.hasErrors('role')}" th:errors="*{role}"
                        class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <div class="flex justify-end">
                  <button type="submit"
                        class="px-4 py-2 bg-blue-900 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2">
                        Add
                  </button>
            </div>
      </form>

</th:block>
