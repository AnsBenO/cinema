<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Register</title>
      <!-- Tailwind CSS -->
      <link rel="stylesheet" th:href="@{/tailwind/output.css}" />
      <!-- Additional CSS -->
      <link rel="stylesheet" th:href="@{/css/styles.css}" />
      <!-- Font Awesome -->
      <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.2/css/all.min.css}">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
      <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
                  <i class="fa-solid fa-user-plus"></i> Create Account
            </h1>

            <form th:action="@{/auth/register}" th:object="${user}" method="post" class="space-y-4">

                  <!-- Username -->
                  <div class="flex flex-col">
                        <label for="username" class="text-gray-700 font-semibold mb-1">
                              <i class="fa-regular fa-user"></i> Username
                        </label>
                        <input type="text" id="username" th:field="*{username}"
                              class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
                              placeholder="Enter your username">
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                              class="text-red-600 text-xs mt-1 block"></span>
                  </div>

                  <!-- Email -->
                  <div class="flex flex-col">
                        <label for="email" class="text-gray-700 font-semibold mb-1">
                              <i class="fa-regular fa-envelope"></i> Email
                        </label>
                        <input type="email" id="email" th:field="*{email}"
                              class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
                              placeholder="Enter your email">
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                              class="text-red-600 text-xs mt-1 block"></span>
                  </div>

                  <!-- Password -->
                  <div class="flex flex-col">
                        <label for="password" class="text-gray-700 font-semibold mb-1">
                              <i class="fa-solid fa-lock"></i> Password
                        </label>
                        <input type="password" id="password" th:field="*{password}"
                              class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
                              placeholder="Enter your password">
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                              class="text-red-600 text-xs mt-1 block"></span>
                  </div>

                  <!-- Global error message -->
                  <div th:if="${errorMessage}" class="text-red-600 text-sm text-center" th:text="${errorMessage}"></div>

                  <!-- Submit -->
                  <button type="submit"
                        class="w-full bg-blue-800 text-white py-3 rounded-lg font-semibold hover:bg-blue-900 transition">
                        <i class="fa-solid fa-user-plus"></i> Register
                  </button>

                  <p class="text-center text-gray-600 text-sm mt-4">
                        Already have an account?
                        <a th:href="@{/auth/login}" class="text-blue-700 hover:underline font-semibold">Login</a>
                  </p>
            </form>
      </div>
</body>

</html>
