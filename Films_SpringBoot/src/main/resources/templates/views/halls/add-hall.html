<th:block th:replace="~{layouts/modal :: modal(~{::.modal-icon}, ~{::.modal-title}, ~{::.modal-form})}">

	<i class="fa-solid fa-door-open modal-icon"></i>
	<span class="modal-title">Add Hall</span>

	<form class="modal-form space-y-4" th:object="${hall}" hx-post="/halls/save" hx-target="#modal"
		hx-swap="outerHTML">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<input type="hidden" th:field="*{id}" />

		<div class="mb-4">
			<label for="hallNumber" class="block text-sm font-medium text-gray-700">Hall Number</label>
			<input type="number" id="hallNumber" th:field="*{number}" placeholder="Enter hall number"
				class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-600 focus:border-blue-600 text-sm" />
			<span th:if="${#fields.hasErrors('number')}" th:errors="*{number}"
				class="text-red-600 text-xs mt-1 block"></span>
		</div>

		<div class="mb-4">
			<label for="hallCapacity" class="block text-sm font-medium text-gray-700">Capacity</label>
			<input type="number" id="hallCapacity" th:field="*{capacity}" placeholder="Enter capacity"
				class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-600 focus:border-blue-600 text-sm" />
			<span th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"
				class="text-red-600 text-xs mt-1 block"></span>
		</div>

		<div class="flex justify-end">
			<button type="submit"
				class="px-4 py-2 bg-blue-900 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2">
				Add
			</button>
		</div>
	</form>

</th:block>
