<th:block th:replace="~{layouts/modal :: modal(~{::.modal-icon}, ~{::.modal-title}, ~{::.modal-form})}">

	<i class="fa-solid fa-flag modal-icon"></i>
	<span class="modal-title">Edit Nationality</span>

	<form class="modal-form space-y-4" th:object="${nationality}"
		th:attr="hx-post=@{/nationalities/edit/{id}(id=${nationality.id})}" hx-target="#modal" hx-swap="outerHTML"
		accept-charset="UTF-8">
		<input type="hidden" th:field="*{id}" />
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

		<div class="mb-4">
			<label for="nationalityLabel" class="block text-sm font-medium text-gray-700">
				Nationality Label
			</label>
			<input type="text" id="nationalityLabel" th:field="*{label}" placeholder="Enter nationality label"
				class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-600 focus:border-blue-600 text-sm" />
			<span th:if="${#fields.hasErrors('label')}" th:errors="*{label}"
				class="text-red-600 text-xs mt-1 block"></span>
		</div>

		<div class="flex justify-end">
			<button type="submit"
				class="px-4 py-2 bg-blue-900 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2">
				Update
			</button>
		</div>
	</form>

</th:block>
