<th:block th:replace="~{layouts/modal :: modal(~{::.modal-icon}, ~{::.modal-title}, ~{::.modal-form})}">

    <i class="fa-solid fa-photo-film modal-icon"></i>
    <span class="modal-title">Add New Media</span>

    <form class="modal-form space-y-4" enctype="multipart/form-data" action="/medias/save" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Media File Upload -->
        <div>
            <label for="file" class="text-gray-700 font-semibold mb-2 flex items-center gap-2">
                <i class="fa-solid fa-image"></i> Media:
            </label>
            <input type="file" id="file" name="file" accept="image/*" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-celeste-default">
        </div>

        <!-- Media Type -->
        <div>
            <label for="mediaType" class="text-gray-700 font-semibold mb-2 flex items-center gap-2">
                <i class="fa-solid fa-tag"></i> Media Type:
            </label>
            <select id="mediaType" name="mediaType" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-celeste-default">
                <option value="IMAGE">Image</option>
                <option value="VIDEO">Video</option>
                <option value="DOCUMENT">Document</option>
            </select>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
            <button type="submit" class="px-4 py-2 bg-green-600 text-white font-semibold rounded hover:bg-green-500">
                <i class="fa-solid fa-plus"></i> Add Media
            </button>
        </div>
    </form>

</th:block>
