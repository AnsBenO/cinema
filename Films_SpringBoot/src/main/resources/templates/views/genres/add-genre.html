<th:block th:replace="~{layouts/modal :: modal(~{::.modal-icon}, ~{::.modal-title}, ~{::.modal-form})}">

    <i class="fa-solid fa-bookmark modal-icon"></i>
    <span class="modal-title" th:text="${genre.id != null} ? 'Edit Genre' : 'Create a New Genre'"></span>

    <form class="modal-form space-y-6" th:object="${genre}" hx-post="/genres" hx-target="#modal" hx-swap="outerHTML">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Genre Label -->
        <div class="flex flex-col">
            <label for="label" class="text-gray-700 font-semibold flex items-center gap-2">
                <i class="fa-solid fa-tag"></i> Genre Label
            </label>
            <input type="text" id="label" th:field="*{label}"
                class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default">
            <span th:if="${#fields.hasErrors('label')}" th:errors="*{label}"
                class="text-red-600 text-xs mt-1 block"></span>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
            <button type="submit" class="bg-blue-800 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-900">
                <i class="fa-solid fa-plus"></i>
                <span th:text="${genre.id != null} ? 'Update Genre' : 'Create Genre'"></span>
            </button>
        </div>
    </form>

</th:block>
