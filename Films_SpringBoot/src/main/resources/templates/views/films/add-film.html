<th:block th:replace="~{layouts/modal :: modal(~{::.modal-icon}, ~{::.modal-title}, ~{::.modal-form})}">

    <i class="fa-solid fa-film modal-icon"></i>
    <span class="modal-title">Create a New Film</span>

    <form class="modal-form space-y-6" th:object="${film}" hx-post="/films" hx-target="#modal" hx-swap="outerHTML"
        hx-encoding="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Film Title and Genre -->
        <div class="flex gap-4">
            <!-- Film Title -->
            <div class="flex flex-col w-1/2">
                <label for="title" class="text-gray-700 font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-square-pen"></i> Title
                </label>
                <input type="text" id="title" th:field="*{title}"
                    class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default">
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"
                    class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <!-- Genre -->
            <div class="flex flex-col w-1/2">
                <label for="genre" class="text-gray-700 font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-film"></i> Genre
                </label>
                <select id="genre" th:field="*{genre}"
                    class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default">
                    <option value="" disabled>Select Genre</option>
                    <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.label}"></option>
                </select>
                <span th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"
                    class="text-red-600 text-xs mt-1 block"></span>
            </div>
        </div>

        <!-- Duration and Year -->
        <div class="flex gap-4">
            <!-- Duration -->
            <div class="flex flex-col w-1/2">
                <label for="duration" class="text-gray-700 font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-clock"></i> Duration (in minutes)
                </label>
                <input type="number" id="duration" th:field="*{duration}"
                    class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default">
                <span th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"
                    class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <!-- Year -->
            <div class="flex flex-col w-1/2">
                <label for="year" class="text-gray-700 font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-calendar"></i> Year
                </label>
                <input type="number" id="year" th:field="*{year}" min="1900" th:max="${T(java.time.Year).now().value}"
                    class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default">
                <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}"
                    class="text-red-600 text-xs mt-1 block"></span>
            </div>
        </div>

        <!-- Nationality and Director -->
        <div class="flex gap-4">
            <!-- Nationality -->
            <div class="flex flex-col w-1/2">
                <label for="nationality" class="text-gray-700 font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-flag"></i> Nationality
                </label>
                <select id="nationality" th:field="*{nationality}"
                    class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default">
                    <option value="" disabled>Select Nationality</option>
                    <option th:each="nationality : ${nationalities}" th:value="${nationality.id}"
                        th:text="${nationality.label}"></option>
                </select>
                <span th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}"
                    class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <!-- Director -->
            <div class="flex flex-col w-1/2">
                <label for="director" class="text-gray-700 font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-user-tie"></i> Director
                </label>
                <select id="director" th:field="*{director}"
                    class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default">
                    <option value="" disabled>Select Director</option>
                    <option th:each="director : ${directors}" th:value="${director.id}"
                        th:text="${director.firstName} + ' ' + ${director.lastName}"></option>
                </select>
                <span th:if="${#fields.hasErrors('director')}" th:errors="*{director}"
                    class="text-red-600 text-xs mt-1 block"></span>
            </div>
        </div>

        <!-- Actors and Film Image Upload -->
        <div class="flex gap-4">
            <!-- Actors -->
            <div class="flex flex-col w-1/2">
                <label for="actors" class="text-gray-700 font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-users"></i> Actors
                </label>
                <select id="actors" th:field="*{actors}"
                    class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default"
                    multiple>
                    <option value="" disabled>Select Actors</option>
                    <option th:each="actor : ${actors}" th:value="${actor.id}"
                        th:text="${actor.firstName} + ' ' + ${actor.lastName}"></option>
                </select>
                <span th:if="${#fields.hasErrors('actors')}" th:errors="*{actors}"
                    class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <!-- Film Poster Image Upload -->
            <div class="flex flex-col w-1/2">
                <label for="file" class="text-gray-700 font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-image"></i> Film Poster
                </label>
                <input type="file" id="file" name="file" accept="image/*"
                    class="mt-1 p-2 border rounded-lg focus:outline-none focus:ring focus:ring-celeste-default">
            </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
            <button type="submit" class="bg-blue-800 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-900">
                <i class="fa-solid fa-plus"></i>
                Create Film
            </button>
        </div>
    </form>

</th:block>
