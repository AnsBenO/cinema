<!-- Sidebar -->
<aside id="sidebar" class="w-64 z-30 bg-gray-100 hidden md:block border-r transition-all duration-300 relative">
      <button id="toggleSidebar"
            class="absolute top-2 -right-3 px-2 bg-gray-200 rounded-full hover:bg-gray-300 shadow-md">
            <i id="toggleIcon" class="fa-solid fa-angle-left"></i>
      </button>
      <nav class="w-full h-full py-7 flex flex-col justify-between" aria-label="Side navigation menu">
            <div class="">

                  <!-- Logo -->
                  <div class="flex items-center gap-3 py-3 px-4 text-gray-800 text-sm mb-5">
                        <i class="fa-solid fa-film text-[#1e3a8a] text-2xl"></i>
                        <span class="sidebar-label font-bold text-2xl">Cinema</span>
                  </div>

                  <!-- Dashboard -->
                  <a th:href="@{/dashboard}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/dashboard">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="sidebar-label">Dashboard</span>
                  </a>

                  <!-- Users -->
                  <a th:href="@{/users}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/users">
                        <i class="fa-solid fa-user"></i>
                        <span class="sidebar-label">Users</span>
                  </a>
                  <a th:href="@{/persons}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/persons">

                        <i class="fa-solid fa-users"></i>
                        <span class="sidebar-label">Persons</span>
                  </a>

                  <!-- Films -->
                  <a th:href="@{/films}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/films">
                        <i class="fa-solid fa-film"></i>
                        <span class="sidebar-label">Films</span>
                  </a>

                  <!-- Screenings -->
                  <a th:href="@{/screenings}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/screenings">
                        <i class="fa-solid fa-calendar"></i>
                        <span class="sidebar-label">Screenings</span>
                  </a>

                  <!-- Genres -->
                  <a th:href="@{/genres}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/genres">
                        <i class="fa-solid fa-tags"></i>
                        <span class="sidebar-label">Genres</span>
                  </a>

                  <!-- Nationalities -->
                  <a th:href="@{/nationalities}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/nationalities">
                        <i class="fa-solid fa-flag"></i>
                        <span class="sidebar-label">Nationalities</span>
                  </a>

                  <!-- Halls -->
                  <a th:href="@{/halls}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/halls">
                        <i class="fa-solid fa-building"></i>
                        <span class="sidebar-label">Halls</span>
                  </a>

                  <!-- Film Ratings -->
                  <a th:href="@{/film-ratings}"
                        class="nav-link flex items-center gap-3 py-3 px-4 rounded hover:bg-slate-200 hover:text-oceanBlue text-gray-800 text-sm"
                        data-path="/film-ratings">
                        <i class="fa-solid fa-star"></i>
                        <span class="sidebar-label">Film Ratings</span>
                  </a>
            </div>

            <!-- Auth Section -->
            <div th:replace="~{/fragments/auth-buttons}"></div>

      </nav>
</aside>

<script>
// Highlight active navigation link based on current URL
document.addEventListener('DOMContentLoaded', function() {
    const navLinks = document.querySelectorAll('.nav-link');
    const currentPath = window.location.pathname;
    
    navLinks.forEach(link => {
        const dataPath = link.getAttribute('data-path');
        // Check if current path matches or starts with the link's data-path
        if (currentPath === dataPath || currentPath.startsWith(dataPath + '/')) {
            // Apply inline styles to ensure they work
            link.style.backgroundColor = '#e2e8f0';  // slate-200
            link.style.color = 'rgb(30, 58, 138)';            // oceanBlue
        }
    });
});
</script>
